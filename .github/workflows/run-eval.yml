name: Run Harmonization Eval

# Manually-triggered leave-one-cluster-out evaluation.
#
# Given the id of a held-out dataset (or a whole cluster), this workflow:
#   1. builds a self-contained run environment outside the checkout with the
#      held-out cluster removed from both the exemplar mapping and the reference
#      code (see src/folds/build_env.py);
#   2. (optionally) stages the held-out dataset(s) raw inputs;
#   3. runs the curator+harmonizer agent *starting in that run folder*; and
#   4. stages the completed, isolated workspace on a new orphan `eval/*` branch,
#      minus `inputs/raw/` (published source data, recorded instead as a sha256
#      manifest so the branch stays under GitHub's 100 MB per-file limit); and
#   5. uploads the *complete* workspace, raw inputs included, as a build artifact.
#
# The branch is the durable record; the artifact is the full-fidelity one but
# expires. Keep that asymmetry in mind when recovering a fold.

on:
  workflow_dispatch:
    inputs:
      holdout:
        description: >-
          Target dataset index (e.g. `5`). Configured targets retain their
          cluster-wide reference holdout while staging only this dataset. A
          comma-separated list or cluster id/name remains available for a
          legacy multi-target run.
        required: true
        type: string
      name:
        description: >-
          Optional name for the run environment (default: the cluster id, or
          `holdout-<ids>`). Becomes the run-environment and artifact name.
        required: false
        type: string
        default: ""
      stage_raw:
        description: >-
          Stage the held-out dataset(s) raw inputs (public Google Drive /
          ESS-DIVE) before running the agent. Best-effort; the run continues even
          if staging fails.
        required: false
        type: boolean
        default: true

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      # The post-agent staging step pushes an orphan branch containing only the
      # isolated run environment. No trusted checkout history is pushed.
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install python tools
        run: uv sync

      - name: Resolve hold-out target
        id: resolve
        env:
          HOLDOUT_INPUT: ${{ inputs.holdout }}
          NAME_INPUT: ${{ inputs.name }}
        run: |
          uv run python -m src.folds.resolve_fold \
            --input "$HOLDOUT_INPUT" --name "$NAME_INPUT" \
            >> "$GITHUB_OUTPUT"
          echo "env_path=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "build_root=$RUNNER_TEMP/harmonization-eval-runs" >> "$GITHUB_OUTPUT"

      - name: Cache ESS-DIVE package metadata for the target
        # Published package records carry fields the payload files often omit —
        # spatial coverage above all. Fetch only the target's record: the cache
        # is the ablation boundary here, and build_env copies by target
        # identifier, so a stray cluster-mate record could never reach the
        # environment even if it were cached. Best-effort, like raw staging:
        # a retired DOI degrades the fold to "no metadata", it does not fail it.
        if: ${{ steps.resolve.outputs.stage_indices != '' }}
        continue-on-error: true
        env:
          STAGE_INDICES: ${{ steps.resolve.outputs.stage_indices }}
        run: |
          uv run python -m src.folds.stage_metadata --indices "$STAGE_INDICES"

      - name: Build leave-one-cluster-out run environment
        env:
          HOLDOUT: ${{ steps.resolve.outputs.holdout }}
          TARGET: ${{ steps.resolve.outputs.target }}
          ENV_NAME: ${{ steps.resolve.outputs.env_name }}
          BUILD_ROOT: ${{ steps.resolve.outputs.build_root }}
          METADATA_CACHE: data/raw_cache/ess-dive_wfsfa_soil_metadata
        run: |
          # --metadata-dir is passed only when the cache exists; build_env
          # copies just the target's <dataset_identifier>.json out of it.
          metadata_args=()
          if [ -d "$METADATA_CACHE" ]; then
            metadata_args=(--metadata-dir "$METADATA_CACHE")
          else
            echo "No metadata cache at $METADATA_CACHE; building without it."
          fi
          uv run python -m src.folds.build_env \
            --holdout "$HOLDOUT" --target "$TARGET" --name "$ENV_NAME" --env-root "$BUILD_ROOT" \
            "${metadata_args[@]}"

      - name: Stage raw data for held-out dataset(s)
        if: ${{ inputs.stage_raw && steps.resolve.outputs.stage_indices != '' }}
        continue-on-error: true
        env:
          STAGE_INDICES: ${{ steps.resolve.outputs.stage_indices }}
          RUN_ENV: ${{ steps.resolve.outputs.build_root }}/${{ steps.resolve.outputs.env_name }}
        run: |
          # The agent is only given this copied input directory, never the shared
          # home-directory cache or the repository checkout.
          uv run python -m src.folds.stage_raw_data --indices "$STAGE_INDICES" \
            --dest "$RUN_ENV/inputs/raw" --drive-method public

      - name: Preserve the invigilator outside the agent workspace
        # The following step deliberately deletes the checkout, including its Python
        # environment. Preserve only the auditor and its already-synced runtime
        # outside the agent's filesystem boundary for the post-run audit.
        env:
          AUDITOR_DIR: ${{ runner.temp }}/harmonization-invigilator
          HOLDOUT: ${{ steps.resolve.outputs.holdout }}
        run: |
          set -euo pipefail
          test -x .venv/bin/python
          mkdir -p "$AUDITOR_DIR"
          cp src/folds/invigilator.py "$AUDITOR_DIR/invigilator.py"
          # The reference holdout decides CONTAMINATED vs LEAK_RISK, but
          # MANIFEST.json deliberately hides it from the agent, and the next
          # step deletes the checkout this mapping lives in. Resolve the
          # indices to identifiers now, outside the agent's boundary.
          # chr(10) rather than a newline escape: this string passes through
          # YAML and single-quoted shell before Python sees it, and an escaped
          # \n survives all three as two literal characters, collapsing the
          # file to one unparseable token.
          .venv/bin/python -c 'import json,sys; idx={int(t) for t in sys.argv[1].split(",") if t.strip().isdigit()}; m=json.load(open("data/gold/sm_data_harmonization_mapping.json")); print(*([str(i) for i in sorted(idx)] + [e["dataset_identifier"] for e in m if e.get("index") in idx and e.get("dataset_identifier")]), sep=chr(10))' \
            "$HOLDOUT" > "$AUDITOR_DIR/reference_holdout.txt"
          echo "reference holdout recorded:"; cat "$AUDITOR_DIR/reference_holdout.txt"
          mv .venv "$AUDITOR_DIR/venv"

      - name: Replace checkout with the isolated agent workspace
        # This is the isolation boundary.  Build/staging happen in the trusted
        # checkout; immediately before Claude starts, replace that checkout
        # (including .git) with the answer-free fold.  The agent can therefore
        # not reach data/gold, the complete mapping, or Git object history.
        env:
          RUN_ENV: ${{ steps.resolve.outputs.build_root }}/${{ steps.resolve.outputs.env_name }}
        run: |
          rsync -a --delete "$RUN_ENV/" "$GITHUB_WORKSPACE/"

      - name: Run harmonization agent in the run environment
        id: harmonize
        # Cap runaway evals so a hung/looping agent can't burn the full 6h limit.
        timeout-minutes: 60
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          mode: agent
          # Pin an explicit current model (the action's built-in default retired).
          model: "claude-opus-4-8"
          # External search, fetch, and ontology tools are deliberately excluded:
          # they could become an alternate route to withheld artifacts or other
          # non-staged data. The agent operates only on the local run workspace.
          allowed_tools: "Bash(*),Edit,MultiEdit,Write,Read,Glob,Grep"
          # AGENT_INSTRUCTIONS.md is the single source of truth for the fold
          # contract. This bootstrap only establishes its authority and the
          # isolation boundary before the agent reads it.
          settings: .claude/settings.local.json
          direct_prompt: |
            You are running a single grouped leave-one-cluster-out harmonization
            evaluation. A self-contained run environment has already been built for
            you in your current working directory. This directory is the complete
            filesystem workspace supplied for the evaluation.

            First read and follow `AGENT_INSTRUCTIONS.md` and `MANIFEST.json`.
            `AGENT_INSTRUCTIONS.md` is authoritative if it conflicts with generic
            guidance in a skill. Remain inside this workspace: do not access parent
            directories, absolute paths outside it, network services, APIs, or other
            external data sources. Write every deliverable under `output/`.

      - name: Capture and invigilate the agent trace
        # The action's execution_file contains its complete tool-use log. Keep
        # the original JSON in the isolated workspace and fail the run on any
        # access outside that workspace. This step is intentionally before
        # branch staging, so the audit result is included in the staged run.
        if: always()
        env:
          AUDITOR_DIR: ${{ runner.temp }}/harmonization-invigilator
          EXECUTION_FILE: ${{ steps.harmonize.outputs.execution_file }}
        run: |
          set -euo pipefail
          mkdir -p audit
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "ERROR: Claude action did not provide an execution trace." \
              | tee audit/invigilator_report.txt
            exit 1
          fi
          cp "$EXECUTION_FILE" audit/claude-execution.json
          "$AUDITOR_DIR/venv/bin/python" "$AUDITOR_DIR/invigilator.py" \
            --trace audit/claude-execution.json --env "$GITHUB_WORKSPACE" \
            --repo-root "$GITHUB_WORKSPACE" \
            --reference-holdout "$AUDITOR_DIR/reference_holdout.txt" \
            --access-trace audit/access_trace.tsv \
            | tee audit/invigilator_report.txt

      - name: Manifest the staged raw inputs
        # `inputs/raw/` holds copies of published ESS-DIVE source data staged for
        # the agent. They are task inputs, not results, and they are the only
        # thing in a fold that routinely exceeds GitHub's 100 MB per-file limit:
        # fold-17/target-23 (run 34244349344) had its branch push rejected outright
        # for a 113.25 MB `WM_SWC.csv`, losing that fold's only durable copy.
        #
        # Record what the agent was given — path, size, sha256 — so the branch
        # still documents its inputs verifiably, then let the staging step commit
        # the manifest instead of the bytes. The bytes stay in the working tree,
        # so the run artifact remains a complete workspace.
        if: always()
        run: |
          set -euo pipefail
          mkdir -p audit
          printf 'sha256\tbytes\tpath\n' > audit/raw_inputs_manifest.tsv
          if [ -d inputs/raw ]; then
            find inputs/raw -type f -print0 \
              | sort -z \
              | while IFS= read -r -d '' f; do
                  printf '%s\t%s\t%s\n' \
                    "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$f"
                done >> audit/raw_inputs_manifest.tsv
          fi
          echo "Staged raw inputs recorded:"
          cat audit/raw_inputs_manifest.tsv

      - name: Stage completed isolated environment on an eval branch
        # This deliberately runs only after the agent. At this point the current
        # workspace is the answer-free fold (not the trusted checkout), so an
        # orphan commit cannot inherit gold artifacts or the source history.
        if: always()
        env:
          ENV_NAME: ${{ steps.resolve.outputs.env_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="eval/${ENV_NAME}-${RUN_ID}-${RUN_ATTEMPT}"

          # `rsync --delete` removed the checkout's .git directory before the
          # agent began. Start a brand-new, parentless repository from exactly
          # the current fold contents; `git add` therefore has no route to the
          # original checkout's history or unseen files.
          git init
          git switch --orphan "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Everything except the staged raw inputs, which are published source
          # data recoverable via `stage_raw_data.py --indices <target>` and are
          # recorded byte-for-byte in audit/raw_inputs_manifest.tsv. Excluding
          # them here keeps the push under GitHub's file-size limit without
          # touching the working tree the artifact is uploaded from.
          git add --all -- . ':(exclude)inputs/raw'
          # Claude Code normally ignores project-local settings. This generated
          # file is part of the evaluated environment and must accompany it.
          git add -f .claude/settings.local.json
          git commit -m "Stage eval environment: ${ENV_NAME} (run ${RUN_ID})"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${branch}"
          echo "Staged isolated evaluation environment on ${branch}"

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ steps.resolve.outputs.env_name }}
          path: ${{ steps.resolve.outputs.env_path }}/
          if-no-files-found: warn
